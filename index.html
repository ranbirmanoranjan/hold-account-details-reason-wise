<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hold Account Details — Reason Wise</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --violet: #6e1db9;
    --violet-dark: #4f1387;
    --violet-soft: #f3ecfb;
    --ink: #1a1a1f;
    --paper: #faf9fc;
    --line: #e6e2ee;
    --muted: #6b6577;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', -apple-system, sans-serif; background: var(--paper); color: var(--ink); }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px; border-bottom: 1px solid var(--line); background: #fff;
  }
  header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  #user-badge { display: none; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  #user-badge img { width: 28px; height: 28px; border-radius: 50%; }
  #signout { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; color: var(--muted); }
  #last-synced { font-size: 12px; color: var(--muted); padding: 2px 10px; border-left: 1px solid var(--line); }

  #gate { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; gap: 16px; text-align: center; }
  #gate h2 { font-size: 22px; margin: 0; }
  #gate p { color: var(--muted); margin: 0 0 8px; max-width: 360px; }
  #gate-error { color: #b3261e; font-size: 13px; display: none; max-width: 360px; }

  main { padding: 24px 32px 40px; display: none; }

  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .stat-card .num { font-size: 26px; font-weight: 700; color: var(--violet); }
  .stat-card .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat-card .sub { font-size: 12px; color: var(--ink); margin-top: 6px; }

  .breakdown-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-bottom: 20px; }
  @media (max-width: 900px) { .breakdown-row { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .panel h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .bar-label { width: 190px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; background: var(--violet-soft); border-radius: 4px; height: 18px; position: relative; overflow: hidden; }
  .bar-fill { background: var(--violet); height: 100%; border-radius: 4px; }
  .bar-count { width: 42px; text-align: right; flex-shrink: 0; color: var(--muted); font-variant-numeric: tabular-nums; }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 16px; }
  .filters .fgroup { display: flex; flex-direction: column; gap: 4px; }
  .filters label { font-size: 11px; color: var(--muted); }
  .filters input, .filters select { border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: 13px; font-family: inherit; }
  .filters input[type=search] { min-width: 200px; flex: 1; }
  #clear-filters { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; font-size: 12px; color: var(--violet); cursor: pointer; }
  .row-count { color: var(--muted); font-size: 12px; margin-left: auto; align-self: center; }

  .date-range { position: relative; }
  .date-range-btn {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px;
    font-size: 13px; font-family: inherit; background: #fff; cursor: pointer; color: var(--ink);
  }
  .date-range-btn:hover { border-color: var(--violet); }
  .date-range-panel {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); overflow: hidden;
  }
  .date-range-panel.open { display: flex; }
  .quick-select { width: 180px; padding: 10px 0; border-right: 1px solid var(--line); }
  .quick-select .grp-label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 8px 16px 4px; }
  .quick-select button {
    display: block; width: 100%; text-align: left; border: none; background: none;
    padding: 8px 16px; font-size: 13px; font-family: inherit; cursor: pointer; color: var(--ink);
  }
  .quick-select button:hover { background: var(--paper); }
  .quick-select button.active { background: var(--violet-soft); color: var(--violet-dark); font-weight: 600; }
  .custom-range-box { width: 260px; padding: 16px; display: none; }
  .custom-range-box.open { display: block; }
  .custom-range-box .crb-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 10px; }
  .custom-range-box .crb-inputs { display: flex; gap: 8px; margin-bottom: 14px; }
  .custom-range-box input[type=date] { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; font-size: 13px; font-family: inherit; }
  .custom-range-box .crb-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .crb-cancel { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 7px 14px; font-size: 12px; cursor: pointer; color: var(--muted); }
  .crb-apply { background: var(--violet); border: none; border-radius: 6px; padding: 7px 14px; font-size: 12px; cursor: pointer; color: #fff; font-weight: 600; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; background: #fbfaff; position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  .table-wrap { max-height: 60vh; overflow: auto; }
  .empty { padding: 24px 20px; color: var(--muted); font-size: 13px; }
  .reason-pill { display: inline-block; padding: 2px 8px; border-radius: 20px; background: var(--violet-soft); color: var(--violet-dark); font-size: 12px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Hold Account Details — Reason Wise</h1>
    <div class="sub">All hold/unhold events across accounts</div>
  </div>
  <div id="user-badge">
    <img id="user-avatar" src="" alt="">
    <span id="user-email"></span>
    <span id="last-synced"></span>
    <button id="signout" onclick="handleSignOut()">Sign out</button>
  </div>
</header>

<div id="gate">
  <h2>Sign in to view this dashboard</h2>
  <p>Use your Spyne Google account. Only spyne.ai and spyne.co.in emails can access this dashboard.</p>
  <div id="g_id_signin"></div>
  <div id="gate-error"></div>
</div>

<main id="app">
  <div class="stats-row" id="stats-row"></div>

  <div class="breakdown-row">
    <div class="panel">
      <h3>Holds by Reason</h3>
      <div id="reason-breakdown"></div>
    </div>
    <div class="panel">
      <h3>Holds by Entity Type</h3>
      <div id="type-breakdown"></div>
    </div>
  </div>

  <div class="filters">
    <div class="fgroup date-range">
      <label>Date range</label>
      <button type="button" class="date-range-btn" id="date-range-btn" onclick="toggleDatePanel()">
        <span id="date-range-label">All time</span> <span>▾</span>
      </button>
      <div class="date-range-panel" id="date-range-panel">
        <div class="quick-select" id="quick-select"></div>
        <div class="custom-range-box" id="custom-range-box">
          <div class="crb-label">Custom range</div>
          <div class="crb-inputs">
            <input type="date" id="crb-from">
            <input type="date" id="crb-to">
          </div>
          <div class="crb-actions">
            <button class="crb-cancel" type="button" onclick="closeDatePanel()">Cancel</button>
            <button class="crb-apply" type="button" onclick="applyCustomRange()">Apply</button>
          </div>
        </div>
      </div>
    </div>
    <div class="fgroup"><label>Entity type</label><select id="f-entity-type" onchange="renderAll()"><option value="">All</option></select></div>
    <div class="fgroup"><label>Reason</label><select id="f-reason" onchange="renderAll()"><option value="">All</option></select></div>
    <div class="fgroup"><label>PoC OB</label><select id="f-poc-ob" onchange="renderAll()"><option value="">All</option></select></div>
    <div class="fgroup"><label>PoC CS</label><select id="f-poc-cs" onchange="renderAll()"><option value="">All</option></select></div>
    <div class="fgroup"><label>Search entity / email</label><input type="search" id="f-search" placeholder="Search..." oninput="renderAll()"></div>
    <button id="clear-filters" onclick="clearFilters()">Clear filters</button>
    <span class="row-count" id="row-count"></span>
  </div>

  <div class="card">
    <div class="table-wrap"><table id="data-table"></table></div>
    <div class="empty" id="empty-msg" style="display:none;">No matching rows.</div>
  </div>
</main>

<script>
const GOOGLE_CLIENT_ID = '269378711505-ueliguk4h0esut6n5117u1qaimp98r63.apps.googleusercontent.com';
const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyYNn7aA6LmJs92j8D0uqT4WkWg17Qi2c_gH5qv6Sm0ET--zYOxeOxGS_W9mEfkCzbb/exec';

let currentToken = null;
let refreshTimer = null;
let syncTickTimer = null;
let lastPullAt = null;
let allRows = [];
let K = {}; // resolved column-name keys, discovered from the actual data headers

// ===== Date range picker state =====
let dateFrom = null; // Date or null (null = no lower bound)
let dateTo = null;   // Date or null (null = no upper bound)
let dateRangeLabel = 'All time';

function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function endOfDay(d) { const x = new Date(d); x.setHours(23, 59, 59, 999); return x; }

const QUICK_RANGES = [
  { group: 'Quick select', label: 'Today', fn: function () { const t = new Date(); return [startOfDay(t), endOfDay(t)]; } },
  { group: 'Quick select', label: 'Yesterday', fn: function () { const t = new Date(); t.setDate(t.getDate() - 1); return [startOfDay(t), endOfDay(t)]; } },
  { group: 'Quick select', label: 'Last 7 days', fn: function () { const t = new Date(); const s = new Date(); s.setDate(s.getDate() - 6); return [startOfDay(s), endOfDay(t)]; } },
  { group: 'Quick select', label: 'Last 30 days', fn: function () { const t = new Date(); const s = new Date(); s.setDate(s.getDate() - 29); return [startOfDay(s), endOfDay(t)]; } },
  { group: 'Months', label: 'This month', fn: function () { const t = new Date(); return [startOfDay(new Date(t.getFullYear(), t.getMonth(), 1)), endOfDay(t)]; } },
  { group: 'Months', label: 'Last month', fn: function () { const t = new Date(); const s = new Date(t.getFullYear(), t.getMonth() - 1, 1); const e = new Date(t.getFullYear(), t.getMonth(), 0); return [startOfDay(s), endOfDay(e)]; } },
  { group: 'Months', label: 'Last 3 months', fn: function () { const t = new Date(); const s = new Date(); s.setMonth(s.getMonth() - 3); return [startOfDay(s), endOfDay(t)]; } },
  { group: 'Months', label: 'Last 6 months', fn: function () { const t = new Date(); const s = new Date(); s.setMonth(s.getMonth() - 6); return [startOfDay(s), endOfDay(t)]; } },
  { group: '', label: 'This year', fn: function () { const t = new Date(); return [startOfDay(new Date(t.getFullYear(), 0, 1)), endOfDay(t)]; } },
  { group: '', label: 'All time', fn: function () { return [null, null]; } },
  { group: '', label: 'Custom range', custom: true }
];

function toggleDatePanel() {
  document.getElementById('date-range-panel').classList.toggle('open');
}
function closeDatePanel() {
  document.getElementById('date-range-panel').classList.remove('open');
  document.getElementById('custom-range-box').classList.remove('open');
}
document.addEventListener('click', function (e) {
  const wrap = document.querySelector('.date-range');
  if (wrap && !wrap.contains(e.target)) closeDatePanel();
});

function renderQuickSelect() {
  const el = document.getElementById('quick-select');
  let html = '';
  let lastGroup = null;
  QUICK_RANGES.forEach(function (opt) {
    if (opt.group && opt.group !== lastGroup) {
      html += '<div class="grp-label">' + opt.group + '</div>';
      lastGroup = opt.group;
    }
    const active = opt.label === dateRangeLabel ? ' active' : '';
    html += '<button type="button" class="' + active.trim() + '" onclick="selectQuickRange(\'' + opt.label + '\')">' + opt.label + '</button>';
  });
  el.innerHTML = html;
}

function selectQuickRange(label) {
  const opt = QUICK_RANGES.find(function (o) { return o.label === label; });
  if (!opt) return;
  if (opt.custom) {
    document.getElementById('custom-range-box').classList.add('open');
    renderQuickSelect();
    return;
  }
  const range = opt.fn();
  dateFrom = range[0];
  dateTo = range[1];
  dateRangeLabel = label;
  document.getElementById('date-range-label').textContent = label;
  document.getElementById('custom-range-box').classList.remove('open');
  renderQuickSelect();
  closeDatePanel();
  renderAll();
}

function applyCustomRange() {
  const fromVal = document.getElementById('crb-from').value;
  const toVal = document.getElementById('crb-to').value;
  dateFrom = fromVal ? startOfDay(new Date(fromVal + 'T00:00:00')) : null;
  dateTo = toVal ? endOfDay(new Date(toVal + 'T00:00:00')) : null;
  dateRangeLabel = (fromVal || 'start') + ' → ' + (toVal || 'today');
  document.getElementById('date-range-label').textContent = dateRangeLabel;
  renderQuickSelect();
  closeDatePanel();
  renderAll();
}

function resolveKeys(headers) {
  function find(fn) { return headers.find(fn) || null; }
  return {
    date: find(function (h) { return /created_at/i.test(h) && !/by_email/i.test(h); }),
    reason: find(function (h) { return /^reason$/i.test(h); }) || 'reason',
    entityType: find(function (h) { return /^entity_type$/i.test(h); }) || 'entity_type',
    entityName: find(function (h) { return /^entity_name$/i.test(h); }) || 'entity_name',
    entityId: find(function (h) { return /entity_id/i.test(h) && !/resolved/i.test(h); }),
    email: find(function (h) { return /created_by_email/i.test(h); }) || 'created_by_email',
    pocOb: find(function (h) { return /poc.?ob/i.test(h); }),
    pocCs: find(function (h) { return /poc.?cs/i.test(h); })
  };
}

window.onload = function () {
  renderQuickSelect();
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    hd: 'spyne.ai'
  });
  google.accounts.id.renderButton(document.getElementById('g_id_signin'), { theme: 'outline', size: 'large' });
};

function handleCredentialResponse(response) {
  currentToken = response.credential;
  const payload = JSON.parse(atob(response.credential.split('.')[1]));
  document.getElementById('user-avatar').src = payload.picture || '';
  document.getElementById('user-email').textContent = payload.email;
  document.getElementById('user-badge').style.display = 'flex';
  loadData();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(loadData, 15 * 60 * 1000);
}

function handleSignOut() {
  currentToken = null;
  if (refreshTimer) clearInterval(refreshTimer);
  if (syncTickTimer) { clearInterval(syncTickTimer); syncTickTimer = null; }
  document.getElementById('user-badge').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
}

function renderLastSynced() {
  const el = document.getElementById('last-synced');
  if (!lastPullAt) { el.textContent = ''; return; }
  const mins = Math.max(0, Math.round((Date.now() - lastPullAt.getTime()) / 60000));
  const timeStr = lastPullAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const ago = mins < 1 ? 'just now' : mins === 1 ? '1 min ago' : mins + ' min ago';
  el.textContent = 'Data as of ' + timeStr + ' (' + ago + ')';
}

function loadData() {
  const errEl = document.getElementById('gate-error');
  errEl.style.display = 'none';
  fetch(GAS_WEBAPP_URL + '?token=' + encodeURIComponent(currentToken))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.error) {
        errEl.textContent = res.error;
        errEl.style.display = 'block';
        document.getElementById('gate').style.display = 'flex';
        document.getElementById('app').style.display = 'none';
        return;
      }
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      allRows = res.rows || [];
      lastPullAt = res.lastPullAt ? new Date(res.lastPullAt) : null;
      renderLastSynced();
      if (!syncTickTimer) syncTickTimer = setInterval(renderLastSynced, 30 * 1000);
      if (allRows.length) K = resolveKeys(Object.keys(allRows[0]));
      populateFilterOptions();
      renderAll();
    })
    .catch(function () {
      errEl.textContent = 'Could not reach the data service. Try again shortly.';
      errEl.style.display = 'block';
    });
}

function uniqueSorted(key) {
  return Array.from(new Set(allRows.map(function (r) { return r[key]; }).filter(Boolean))).sort();
}

function fillSelect(id, values) {
  const sel = document.getElementById(id);
  const current = sel.value;
  sel.innerHTML = '<option value="">All</option>' + values.map(function (v) {
    return '<option value="' + String(v).replace(/"/g, '&quot;') + '">' + v + '</option>';
  }).join('');
  sel.value = current;
}

function populateFilterOptions() {
  fillSelect('f-entity-type', uniqueSorted(K.entityType));
  fillSelect('f-reason', uniqueSorted(K.reason));
  if (K.pocOb) fillSelect('f-poc-ob', uniqueSorted(K.pocOb));
  if (K.pocCs) fillSelect('f-poc-cs', uniqueSorted(K.pocCs));
}

function clearFilters() {
  dateFrom = null;
  dateTo = null;
  dateRangeLabel = 'All time';
  document.getElementById('date-range-label').textContent = 'All time';
  document.getElementById('crb-from').value = '';
  document.getElementById('crb-to').value = '';
  renderQuickSelect();
  document.getElementById('f-entity-type').value = '';
  document.getElementById('f-reason').value = '';
  document.getElementById('f-poc-ob').value = '';
  document.getElementById('f-poc-cs').value = '';
  document.getElementById('f-search').value = '';
  renderAll();
}

function getFiltered() {
  const entityType = document.getElementById('f-entity-type').value;
  const reason = document.getElementById('f-reason').value;
  const pocOb = document.getElementById('f-poc-ob').value;
  const pocCs = document.getElementById('f-poc-cs').value;
  const search = document.getElementById('f-search').value.toLowerCase();

  return allRows.filter(function (r) {
    if (entityType && r[K.entityType] !== entityType) return false;
    if (reason && r[K.reason] !== reason) return false;
    if (pocOb && r[K.pocOb] !== pocOb) return false;
    if (pocCs && r[K.pocCs] !== pocCs) return false;
    if (K.date && (dateFrom || dateTo)) {
      const d = r[K.date] ? new Date(r[K.date]) : null;
      if (!d || isNaN(d)) return false;
      if (dateFrom && d < dateFrom) return false;
      if (dateTo && d > dateTo) return false;
    }
    if (search) {
      const hay = [r[K.entityName], r[K.email], r[K.entityId], r[K.reason]].join(' ').toLowerCase();
      if (hay.indexOf(search) === -1) return false;
    }
    return true;
  });
}

function countBy(rows, key) {
  const counts = {};
  rows.forEach(function (r) {
    const v = r[key] || '(blank)';
    counts[v] = (counts[v] || 0) + 1;
  });
  return Object.entries(counts).sort(function (a, b) { return b[1] - a[1]; });
}

function renderStats(rows) {
  const total = rows.length;
  const uniqueEntities = new Set(rows.map(function (r) { return r[K.entityId] || r[K.entityName]; })).size;
  const reasonCounts = countBy(rows, K.reason);
  const pocObCounts = K.pocOb ? countBy(rows, K.pocOb) : [];
  const topReason = reasonCounts[0];
  const topPoc = pocObCounts[0];

  const cards = [
    { num: total, lbl: 'Total holds (filtered)' },
    { num: uniqueEntities, lbl: 'Unique entities on hold' },
    { num: topReason ? topReason[1] : 0, lbl: 'Top reason', sub: topReason ? topReason[0] : '—' },
    { num: topPoc ? topPoc[1] : 0, lbl: 'Most-affected PoC OB', sub: topPoc ? topPoc[0] : '—' }
  ];
  document.getElementById('stats-row').innerHTML = cards.map(function (c) {
    return '<div class="stat-card"><div class="num">' + c.num + '</div><div class="lbl">' + c.lbl + '</div>' +
      (c.sub ? '<div class="sub">' + c.sub + '</div>' : '') + '</div>';
  }).join('');
}

function renderBars(containerId, entries, max) {
  const top = entries.slice(0, 8);
  const maxCount = Math.max.apply(null, top.map(function (e) { return e[1]; }).concat([1]));
  document.getElementById(containerId).innerHTML = top.map(function (e) {
    const pct = Math.round((e[1] / maxCount) * 100);
    return '<div class="bar-row"><div class="bar-label" title="' + e[0] + '">' + e[0] + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="bar-count">' + e[1] + '</div></div>';
  }).join('') || '<div class="empty">No data.</div>';
}

function renderTable(rows) {
  document.getElementById('row-count').textContent = rows.length + ' of ' + allRows.length + ' rows';
  const table = document.getElementById('data-table');
  const emptyMsg = document.getElementById('empty-msg');
  table.innerHTML = '';
  if (!rows.length) { emptyMsg.style.display = 'block'; return; }
  emptyMsg.style.display = 'none';

  const displayCols = [K.entityType, K.reason, K.email, K.date, K.entityId, K.entityName, K.pocOb, K.pocCs].filter(Boolean);
  const thead = document.createElement('tr');
  displayCols.forEach(function (h) {
    const th = document.createElement('th');
    th.textContent = h;
    thead.appendChild(th);
  });
  table.appendChild(thead);

  rows.slice(0, 1000).forEach(function (row) {
    const tr = document.createElement('tr');
    displayCols.forEach(function (h) {
      const td = document.createElement('td');
      if (h === K.reason) {
        const span = document.createElement('span');
        span.className = 'reason-pill';
        span.textContent = row[h];
        td.appendChild(span);
      } else {
        td.textContent = row[h];
      }
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
}

function renderAll() {
  if (!allRows.length) return;
  const filtered = getFiltered();
  renderStats(filtered);
  renderBars('reason-breakdown', countBy(filtered, K.reason));
  renderBars('type-breakdown', countBy(filtered, K.entityType));
  renderTable(filtered);
}
</script>
</body>
</html>
